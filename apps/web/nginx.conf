# SynRecordia static SPA server.
#
# This container serves the built React app. The ALB routes traffic to the
# correct target group by path, so this nginx does NOT proxy /ws* or /api* —
# those go to the relay target group directly.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-lived hashed asset cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Songs/samples are large static files — cache aggressively.
    location ~* \.(mp3|wav|ogg|png|jpg|svg|ico|webmanifest|json)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA fallback: any unknown path serves index.html (replaces Netlify
    # `/_redirects` rule `/* /index.html 200`).
    location / {
        try_files $uri /index.html;
    }

    # Security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
